<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>База — заметки</title>
    <script>
      // тема — до отрисовки, чтобы не мигало (как в index.html)
      try {
        var t = localStorage.getItem('ndc.theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="dk-body">
    <div id="root"></div>
    <script type="module" src="/src/desktop/main.tsx"></script>
  </body>
</html>
